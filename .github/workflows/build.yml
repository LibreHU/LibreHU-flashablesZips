name: Build zips

on:
  push:
    branches: [main]
  schedule:
    # Every hour: picks up a new TWRP release of the device repository or a new kernel build (latest-<branch>
    # releases of the kernel repository); nothing is published when no zip changed.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zips
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zips and index.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/build.py

      - name: Changed since the published index?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Zips are reproducible (fixed dates in the archives): same versions and SHA-256 = nothing new.
          # Pushes and manual runs always publish; the hourly run only when something changed.
          if [ "${{ github.event_name }}" != schedule ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh release download zips -p index.json -O published.json 2>/dev/null || { echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; }
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          def key(p):
              d = json.load(open(p))
              return (d.get("categories"), sorted((z["id"], z.get("version"), z.get("sha256"), z.get("image_sha256"),
                      json.dumps(z, sort_keys=True)) for z in d["zips"]))
          print("publish=" + ("false" if key("published.json") == key("dist/index.json") else "true"))
          PY
          cat "$GITHUB_OUTPUT"

      - name: Publish (release "zips")
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=zips
          {
            echo "Zips flashables LibreHU, construits par la CI depuis \`zips/\` (commit ${GITHUB_SHA::7})."
            echo
            echo "Index pour LibreHU Apps : \`index.json\`."
            echo
            python3 -c "import json;d=json.load(open('dist/index.json'));[print(f\"- **{z['name']}** ({z['category']}, {z['version']}) : \`{z['id']}.zip\`\") for z in d['zips']]"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Zips flashables" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "Zips flashables" --notes-file notes.md --latest
          fi
          gh release upload "$TAG" dist/* --clobber
          # Assets no longer built (zip removed or renamed) are deleted.
          for a in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            [ -e "dist/$a" ] || gh release delete-asset "$TAG" "$a" -y
          done

      - name: Fail when a zip did not build
        run: |
          if [ -f build/failed.txt ]; then echo "Not built:"; cat build/failed.txt; exit 1; fi
